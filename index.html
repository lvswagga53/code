<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Martingale Risk Calculator</title>

<style>
body {
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    margin: 0;
    background: #0f172a;
    color: white;
    padding: 16px;
}

.container {
    max-width: 520px;
    margin: auto;
}

h2 {
    text-align: center;
    margin-bottom: 16px;
}

.card {
    background: #1e293b;
    padding: 14px;
    border-radius: 12px;
    margin-bottom: 14px;
}

label {
    font-size: 13px;
    opacity: 0.9;
}

input, button {
    width: 100%;
    padding: 12px;
    margin-top: 6px;
    border-radius: 8px;
    border: none;
    font-size: 16px;
}

button {
    background: #22c55e;
    font-weight: bold;
}

.warning {
    text-align: center;
    font-weight: bold;
    margin-top: 10px;
    color: #f87171;
}

canvas {
    width: 100%;
    height: 200px;
    background: #020617;
    border-radius: 10px;
    margin-top: 10px;
}

table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 10px;
    font-size: 12px;
}

th, td {
    padding: 6px;
    text-align: center;
}

th {
    background: #334155;
}

tr:nth-child(even) {
    background: #1e293b;
}
</style>
</head>

<body>

<div class="container">

<h2>📊 Martingale Risk Calculator</h2>

<div class="card">

    <label>Bankroll</label>
    <input id="bankroll" type="number" value="1000">

    <label>Risk % per trade</label>
    <input id="riskPercent" type="number" value="2">

    <label>Rounds</label>
    <input id="rounds" type="number" value="10">

    <label>Profit Target</label>
    <input id="profitTarget" type="number" value="100">

    <label>Payout %</label>
    <input id="payout" type="number" value="100">

    <button onclick="calculate()">Calculate</button>

    <div id="warning" class="warning"></div>

</div>

<div class="card">
    <canvas id="chart"></canvas>
</div>

<div class="card" id="tableBox"></div>

</div>

<script>

function calculate() {

    const bankroll = +document.getElementById("bankroll").value;
    const riskPercent = +document.getElementById("riskPercent").value;
    const rounds = +document.getElementById("rounds").value;
    const profitTarget = +document.getElementById("profitTarget").value;
    const payout = +document.getElementById("payout").value;

    let startBet = bankroll * (riskPercent / 100);

    let totalLoss = 0;
    let data = [];
    let warning = "";

    let maxLoss = startBet * (Math.pow(2, rounds) - 1);

    if (maxLoss > bankroll) {
        warning = "⚠️ Risk too high — martingale can exceed bankroll";
    }

    for (let i = 0; i < rounds; i++) {

        let bet = startBet * Math.pow(2, i);

        totalLoss += bet;

        let win = bet * (payout / 100);

        let netIfWin = win - totalLoss;

        data.push({
            round: i + 1,
            bet,
            loss: totalLoss,
            win,
            netIfWin
        });

        if (totalLoss > bankroll && !warning) {
            warning = "⚠️ Bankroll exceeded during progression";
            break;
        }
    }

    document.getElementById("warning").innerText = warning;

    renderTable(data);
    drawChart(data.map(d => d.loss), bankroll, profitTarget);
}

function renderTable(data) {

    let html = `
    <table>
        <tr>
            <th>R</th>
            <th>Bet</th>
            <th>Loss</th>
            <th>Win</th>
            <th>Net</th>
        </tr>
    `;

    data.forEach(d => {
        html += `
        <tr>
            <td>${d.round}</td>
            <td>$${d.bet.toFixed(2)}</td>
            <td>$${d.loss.toFixed(2)}</td>
            <td>$${d.win.toFixed(2)}</td>
            <td style="color:${d.netIfWin >= 0 ? '#22c55e' : '#f87171'}">
                $${d.netIfWin.toFixed(2)}
            </td>
        </tr>`;
    });

    html += "</table>";

    document.getElementById("tableBox").innerHTML = html;
}

function drawChart(data, bankroll, target) {

    const canvas = document.getElementById("chart");
    const ctx = canvas.getContext("2d");

    canvas.width = canvas.offsetWidth;
    canvas.height = 200;

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    let max = Math.max(...data, bankroll, target);

    ctx.beginPath();
    data.forEach((val, i) => {
        let x = (i / (data.length - 1 || 1)) * canvas.width;
        let y = canvas.height - (val / max) * canvas.height;

        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
    });
    ctx.strokeStyle = "#22c55e";
    ctx.lineWidth = 2;
    ctx.stroke();

    let y1 = canvas.height - (bankroll / max) * canvas.height;
    ctx.beginPath();
    ctx.moveTo(0, y1);
    ctx.lineTo(canvas.width, y1);
    ctx.strokeStyle = "#f87171";
    ctx.stroke();

    let y2 = canvas.height - (target / max) * canvas.height;
    ctx.beginPath();
    ctx.moveTo(0, y2);
    ctx.lineTo(canvas.width, y2);
    ctx.strokeStyle = "#60a5fa";
    ctx.stroke();
}

</script>

</body>
</html>
